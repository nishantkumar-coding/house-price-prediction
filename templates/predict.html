<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Predict Price - EstateIntellect AI</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
            color: #f8fafc;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        /* Navigation Bar consistency */
        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 80px;
            background: rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }
        .logo {
            font-size: 1.4rem;
            font-weight: bold;
            background: linear-gradient(to right, #38bdf8, #818cf8);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .nav-links a {
            color: #94a3b8;
            text-decoration: none;
            margin-left: 30px;
            font-weight: 500;
            transition: color 0.2s;
        }
        .nav-links a:hover {
            color: #38bdf8;
        }
        /* Main Content Center layout */
        .content-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 20px;
        }
        .form-container {
            width: 100%;
            max-width: 800px;
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 16px;
            padding: 30px;
            backdrop-filter: blur(10px);
            box-sizing: border-box;
        }
        h2 {
            text-align: center;
            margin-top: 0;
            margin-bottom: 30px;
            background: linear-gradient(to right, #38bdf8, #818cf8);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .grid-form {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
        }
        .form-group {
            display: flex;
            flex-direction: column;
        }
        label {
            font-size: 0.9rem;
            color: #94a3b8;
            margin-bottom: 6px;
        }
        input {
            padding: 10px;
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 6px;
            color: white;
            font-size: 1rem;
        }
        input:focus {
            outline: none;
            border-color: #38bdf8;
        }
        .btn-submit {
            grid-column: 1 / -1;
            padding: 14px;
            background: linear-gradient(to right, #0284c7, #4f46e5);
            color: white;
            border: none;
            font-size: 1.1rem;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 10px;
            transition: opacity 0.2s;
        }
        .btn-submit:hover {
            opacity: 0.9;
        }
        /* Back Button Style */
        .btn-back {
            display: inline-block;
            margin-top: 20px;
            color: #94a3b8;
            text-decoration: none;
            font-weight: 500;
            transition: color 0.2s;
        }
        .btn-back:hover {
            color: #f8fafc;
        }
        .result-box {
            margin-top: 30px;
            padding: 20px;
            background: rgba(16, 185, 129, 0.1);
            border: 1px solid rgba(16, 185, 129, 0.3);
            border-radius: 8px;
            text-align: center;
            width: 100%;
            max-width: 800px;
            box-sizing: border-box;
        }
        .result-text {
            font-size: 1.5rem;
            color: #10b981;
            font-weight: bold;
            margin: 0;
        }
    </style>
</head>
<body>

    <nav class="navbar">
        <div class="logo">EstateIntellect AI</div>
        <div class="nav-links">
            <a href="/">Home</a>
            <a href="/predict_form">Price Predictor</a>
            <a href="/analytics">Market Analytics (Dashboard)</a>
        </div>
    </nav>

    <div class="content-area">
        <div class="form-container">
            <h2>Enter House Details</h2>
            <form action="/predict" method="POST" class="grid-form">
                <div class="form-group"><label>Bedrooms</label><input type="number" name="bedrooms" value="3" required></div>
                <div class="form-group"><label>Bathrooms</label><input type="number" step="0.1" name="bathrooms" value="2.25" required></div>
                <div class="form-group"><label>Sqft Living Space</label><input type="number" name="sqft_living" value="2000" required></div>
                <div class="form-group"><label>Sqft Lot Size</label><input type="number" name="sqft_lot" value="5000" required></div>
                <div class="form-group"><label>Floors</label><input type="number" step="0.5" name="floors" value="1" required></div>
                <div class="form-group"><label>Waterfront (0 or 1)</label><input type="number" name="waterfront" value="0" min="0" max="1" required></div>
                <div class="form-group"><label>View (0 to 4)</label><input type="number" name="view" value="0" min="0" max="4" required></div>
                <div class="form-group"><label>Condition (1 to 5)</label><input type="number" name="condition" value="3" min="1" max="5" required></div>
                <div class="form-group"><label>Grade (1 to 13)</label><input type="number" name="grade" value="7" min="1" max="13" required></div>
                <div class="form-group"><label>Sqft Above</label><input type="number" name="sqft_above" value="1600" required></div>
                <div class="form-group"><label>Sqft Basement</label><input type="number" name="sqft_basement" value="4000" required></div>
                <div class="form-group"><label>Year Built</label><input type="number" name="yr_built" value="1995" required></div>
                <div class="form-group"><label>Year Renovated</label><input type="number" name="yr_renovated" value="0" required></div>
                <div class="form-group"><label>Zipcode</label><input type="number" name="zipcode" value="98178" required></div>
                <div class="form-group"><label>Latitude</label><input type="number" step="0.0001" name="lat" value="47.5112" required></div>
                <div class="form-group"><label>Longitude</label><input type="number" step="0.0001" name="long" value="-122.257" required></div>
                <div class="form-group"><label>Sqft Living 15</label><input type="number" name="sqft_living15" value="1690" required></div>
                <div class="form-group"><label>Sqft Lot 15</label><input type="number" name="sqft_lot15" value="7639" required></div>
                
                <button type="submit" class="btn-submit">Predict House Price</button>
            </form>
        </div>

        {% if prediction_text %}
        <div class="result-box">
            <p class="result-text">{{ prediction_text }}</p>
        </div>
        {% endif %}

        <a href="/" class="btn-back">← Back to Home</a>
    </div>

</body>
</html>
